<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrenador de Ajedrez</title>
<style>
:root{--k:1;--bg:#161512;--panel:#201e1b;--panel2:#2a2724;--line:#3a3632;--txt:#e8e4dc;--mut:#9b958a;--acc:#8ab34a;--acc2:#e0a83a;--bad:#d9594c;--light:#f0d9b5;--dark:#b58863}
*{box-sizing:border-box}
body{--auto:min(760px,max(300px,calc(100vh - 125px)));--bw:calc(var(--auto) * var(--k));margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap}
nav{display:flex;flex-wrap:wrap;gap:0}
nav button{background:transparent;color:var(--mut);border:1px solid transparent;padding:6px 7px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{color:var(--txt)}
nav button.on{background:var(--panel2);color:var(--txt);border-color:var(--line)}
#sizeBox{margin-left:auto;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
#sizeBox input{width:64px;accent-color:var(--acc)}
#wideBtn{font-size:13px}
#sndBtn{padding:5px 8px;display:inline-flex;align-items:center}
#sndPop{position:fixed;top:48px;right:12px;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:none;flex-direction:column;gap:9px;min-width:230px;font-size:14px}
#sndPop.open{display:flex}#sndPop label{display:flex;align-items:center;gap:8px;cursor:pointer}#sndPop input[type=range]{flex:1;accent-color:var(--acc)}#sndPop .small{color:var(--mut);font-size:12px}
#engstat{font-size:12px;color:var(--mut);white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,var(--bw)) minmax(300px,1fr);gap:20px;padding:16px;max-width:1500px;margin:0 auto}
body.wide{--auto:min(500px,max(300px,calc(100vh - 125px)))}
@media(max-height:700px){
 body{--auto:min(760px,max(280px,calc(100vh - 100px)))}body.wide{--auto:min(500px,max(280px,calc(100vh - 100px)))}
 header{padding:4px 12px}header h1{font-size:15px}nav button{padding:4px 10px}#sizeBox{display:flex}
 main{padding:8px 16px;gap:14px}aside{height:calc(100vh - 62px);min-height:0;top:8px}#chat{font-size:15px}
}
@media(max-width:900px){body,body.wide{--bw:100%}main{grid-template-columns:minmax(0,1fr);padding:12px 16px}}
.boardWrap{display:flex;gap:8px;max-width:var(--bw)}
#evalbar{width:18px;border-radius:4px;background:#2b2b2b;position:relative;overflow:hidden;flex:none;border:1px solid var(--line)}
#evalFill{position:absolute;left:0;right:0;bottom:0;height:50%;background:#f4f1ea;transition:height .4s}
#evalTxt{position:absolute;left:0;right:0;top:2px;font-size:9px;text-align:center;color:#999;mix-blend-mode:difference}
#board{flex:1;aspect-ratio:1;position:relative;container-type:inline-size;user-select:none;touch-action:none;border-radius:4px;overflow:hidden}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.light{background:var(--light)}.sq.dark{background:var(--dark)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,214,0,.35)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(80,160,255,.45)}
.sq.check{box-shadow:inset 0 0 0 100px rgba(230,60,50,.55)}
.sq.mark{box-shadow:inset 0 0 0 100px rgba(60,200,120,.5)}
.sq[data-f]::after{content:attr(data-f);position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:600;opacity:.7;color:#333}
.sq[data-r]::before{content:attr(data-r);position:absolute;left:3px;top:1px;font-size:10px;font-weight:600;opacity:.7;color:#333}
.pc{width:92%;height:92%;cursor:grab;position:relative;z-index:2}
.pc svg,.ghost svg,.promo button svg{width:100%;height:100%;display:block}
.pc.w,.ghost.w,.promo .w{--f:#fbfbf8;--s:#262626;--d:#262626}
.pc.b,.ghost.b,.promo .b{--f:#3b3b40;--s:#0c0c0d;--d:#d8d8d4}
.o{fill:var(--s);stroke:var(--s);stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.i{fill:var(--f);stroke:none}
.d{fill:none;stroke:var(--d);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pc.ghosted{opacity:.25}
.dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,85,30,.5);z-index:1;pointer-events:none}
.cap{position:absolute;inset:4%;border-radius:50%;border:.9cqw solid rgba(20,85,30,.5);z-index:1;pointer-events:none}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.promo{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:5;display:flex;align-items:center;justify-content:center;gap:8px}
.promo[hidden]{display:none}
.promo button{width:18%;aspect-ratio:1;background:#eee;border:0;border-radius:8px;cursor:pointer;padding:6px}
.ghost{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%)}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;max-width:var(--bw)}
.controls button{padding:5px 10px;font-size:13px}
button.b,.controls button,#ctl button,.chip{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);color:#102000;border-color:var(--acc);font-weight:600}
#status{margin-left:auto;color:var(--acc2);font-size:13px;align-self:center}
#movelist{max-width:var(--bw);display:flex;flex-wrap:wrap;gap:2px 4px;font-size:13px;margin-top:8px}
#movelist span.n{color:var(--mut);margin-left:6px}
#movelist span.m{padding:1px 5px;border-radius:4px;cursor:pointer}
#movelist span.m.k-inacc{box-shadow:inset 0 -2px #e0c23a}#movelist span.m.k-mistake{box-shadow:inset 0 -2px #e0883a}#movelist span.m.k-blunder{box-shadow:inset 0 -2px #d9594c}
#movelist span.m:hover{background:var(--panel2)}#movelist span.m.cur{background:var(--acc);color:#102000}
#engineLines{max-width:var(--bw);font-size:13px;color:var(--mut);margin-top:6px;font-family:ui-monospace,Consolas,monospace}
#engineLines div{margin:2px 0}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;height:calc(100vh - 90px);min-height:520px;position:sticky;top:12px}
@media(max-width:900px){aside{position:static;height:auto;min-height:0}#chat{min-height:360px;max-height:70vh}}
#ctl{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:none}
#ctl.hide{display:none}
#ctl .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ctlToggle{flex:none;background:var(--panel2);border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);padding:4px;font:inherit;font-size:12px;cursor:pointer;width:100%}
#ctlToggle:hover{color:var(--txt)}
#ctl label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
#ctl select,#ctl input,#ctl textarea{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
#ctl .row{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--acc);color:#102000;border-color:var(--acc)}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:200px;font-size:16px;line-height:1.55}
.msg{display:flex;gap:8px;align-items:flex-start;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#102000;display:flex;align-items:center;justify-content:center;font-size:18px}
.bub{background:var(--panel2);border-radius:4px 12px 12px 12px;padding:10px 14px;max-width:100%}
.msg.ok .bub{border-left:3px solid var(--acc)}.msg.bad .bub{border-left:3px solid var(--bad)}.msg.warn .bub{border-left:3px solid var(--acc2)}
.msg.me{justify-content:flex-end}.msg.me .bub{background:#33402a;border-radius:12px 4px 12px 12px}
.bub b{color:#fff}.bub ul{margin:4px 0 0;padding-left:18px}
#chips{padding:8px 12px 12px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);min-height:52px}
.chip:hover{border-color:var(--acc)}
.panel{padding:14px;overflow:auto}
.panel h3{margin:14px 0 6px;font-size:14px}.panel table{width:100%;border-collapse:collapse;font-size:14px}.panel td,.panel th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--acc)}
footer{max-width:1180px;margin:0 auto;padding:0 16px 24px;color:var(--mut);font-size:12px}
.small{font-size:12px;color:var(--mut)}
</style>
</head>

<header>
  <h1>&#9822; Entrenador de Ajedrez</h1>
  <nav id="tabs">
    <button data-m="today">Hoy</button>
    <button data-m="lesson">Lecciones</button>
    <button data-m="review">Repaso</button>
    <button data-m="exam">Examen</button>
    <button data-m="tactics">Táctica</button>

    <button data-m="edit">Crear</button>

  <label id="sizeBox" title="Tamaño del tablero (doble clic para restablecer)">Tablero <input type="range" id="sizeK" min="60" max="140" step="5" value="100"></label>

</header>

<div id="sndPop" role="dialog" aria-label="Sonido">
 <label><input type="checkbox" id="sndOn"> Sonidos de jugadas y avisos</label>
 <label>Volumen <input type="range" id="sndVol" min="0" max="100" step="5"></label>
 <label><input type="checkbox" id="sndVoice"> Voz: leer al entrenador</label>
 <label><input type="checkbox" id="sndAnn"> Voz: anunciar cada jugada</label>
 <button id="sndTest" class="b">Probar sonidos</button>

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const FILES='abcdefgh';
const pieceSvg=ch=>{const t=ch.toLowerCase();return `<svg viewBox="1.5 1 42 42"><use href="#s_${t}" class="o"/><use href="#s_${t}" class="i"/><use href="#d_${t}" class="d"/></svg>`};
const clean=s=>String(s).replace(/[+#!?]/g,'');

/* =============== CONTENIDO: LECCIONES =============== */
const LESSONS=[{
 id:'catalana',title:'Apertura Catalana (con blancas)',side:'w',
 intro:'La Catalana combina el centro del Gambito de Dama (d4 + c4) con el fianchetto de alfil (g3 + Ag2). Tu alfil de g2 presionará d5 y toda la diagonal larga hacia b7 y a8. Es un sistema posicional: ventajas pequeñas y presión constante, ideal para crecer hacia el nivel de maestro.',
 chapters:[
 {id:'c1',title:'1. Fundamentos: la idea de la Catalana',
  intro:'Primero construimos el esquema base: <b>1.d4 Cf6 2.c4 e6 3.g3 d5 4.Ag2</b>. Estas cinco jugadas aparecen en casi todas las líneas.',
  moves:[
  {san:'d4',c:'Ocupa el centro, controla e5 y c5 y abre líneas para la dama y el alfil de casillas blancas.'},
  {san:'Nf6',c:'Negro desarrolla controlando e4 y e5 y mantiene flexible su estructura.'},
  {san:'c4',c:'Presiona d5 y te da un centro de dos peones (d4 + c4). Es el esquema del Gambito de Dama.',a:[['c4','d5']]},
  {san:'e6',c:'Negro apoya ...d5 de forma sólida, aunque deja al alfil de c8 algo encerrado.'},
  {san:'g3',c:'<b>La jugada que define la Catalana.</b> Prepara Ag2 sobre la diagonal larga y evita las clavadas de la Nimzoindia (...Ab4 contra Cc3). Además deja flexible el caballo de b1.',a:[['g2','a8']],h:'Piensa en un fianchetto: ¿qué peón debe avanzar para que salga el alfil de f1?',wrong:{'Nc3':'Cc3 es la Defensa Nimzoindia/Gambito de Dama normal; en la Catalana evitamos comprometer el caballo y jugamos <b>g3</b>.','Nf3':'Cf3 es útil, pero aquí queremos el orden de jugadas de la Catalana: <b>g3</b> primero para fijar el fianchetto.'}},
  {san:'d5',c:'Negro ocupa el centro. El peón de d5 será el objetivo de tu alfil.'},
  {san:'Bg2',c:'Tu pieza clave: apunta a d5, c6 y b7. Si cambias este alfil sin motivo pierdes la esencia de la apertura.',a:[['g2','d5']]}],
  outro:'<b>Ideas clave del capítulo</b><ul><li>El Ag2 es tu mejor pieza: presiona d5 y el flanco de dama.</li><li>Planes habituales: enrocar corto, Cf3, Dc2 y recuperar el peón de c4 si Negro lo captura.</li><li>Ahora estudia las dos grandes respuestas: 4...Ae7 (cerrada) y 4...dxc4 (abierta).</li></ul>'},
 {id:'c2',title:'2. Catalana cerrada (4...Ae7)',
  intro:'Negro mantiene la tensión y se enroca. Tu plan: desarrollar, enrocar, <b>Dc2</b> y romper con <b>e4</b>.',
  moves:[
  {san:'d4',c:'Centro.'},{san:'Nf6',c:''},{san:'c4',c:'Presión sobre d5.'},{san:'e6',c:''},
  {san:'g3',c:'Fianchetto de la Catalana.'},{san:'d5',c:''},{san:'Bg2',c:'El alfil apunta a d5.'},
  {san:'Be7',c:'Negro prepara el enroque sin ceder el centro: la <b>Catalana cerrada</b>.'},
  {san:'Nf3',c:'Desarrolla, controla e5 y d4 y prepara el enroque.',h:'Desarrolla el caballo de rey.'},
  {san:'O-O',c:''},
  {san:'O-O',c:'Rey seguro; Ag2 y Cf3 trabajan juntos y la torre de f1 queda lista para el centro.',h:'Pon el rey a salvo.'},
  {san:'Nbd7',c:'Negro desarrolla pensando en ...c6 y ...b6 o ...dxc4.'},
  {san:'Qc2',c:'Vigila c4 y la columna c, protege e4 para cuando avances y prepara Td1 o Cbd2.',a:[['c2','c4']],h:'La dama sale por la columna c.'},
  {san:'c6',c:'Negro refuerza d5, aunque el peón c6 bloquea su propio alfil... y tapa la diagonal de tu Ag2.'},
  {san:'Nbd2',c:'Prepara e4 sin estorbar a la dama y apoya c4 y e4.',h:'El caballo de b1 va hacia el centro sin bloquear nada.'},
  {san:'b6',c:'Negro quiere ...Ab7 y ...c5.'},

  {san:'Bb7',c:'Negro desarrolla su alfil de dama.'}],
  outro:'<b>Posición típica</b>: blancas con más espacio y presión; Negro sólido pero algo pasivo.<ul><li>Ideas: Td1/Te1, e5 en el momento justo, o cxd5 para abrir la diagonal del Ag2.</li><li>Cuidado con ...c5 y ...dxe4: calcula siempre la recaptura Cxe4.</li><li>Practica esta posición contra Stockfish para sentir el plan.</li></ul>'},
 {id:'c3',title:'3. Catalana abierta (4...dxc4)',

  {san:'Be7',c:''},
  {san:'O-O',c:'Enroque corto; el Ag2 sigue presionando.',h:'Rey a salvo.'},
  {san:'O-O',c:''},
  {san:'Qc2',c:'Ataca c4 y prepara Dxc4. También libera la torre de a1 para el flanco.',a:[['c2','c4']],h:'Ataca el peón de c4 con la dama.'},
  {san:'a6',c:'Negro prepara ...b5 para defender el peón extra. Es la defensa principal.'},

  $('#lsSel').value=this.li;

 },
 del(){
  const L=this.lesson();if(!L.custom){Chat.say('Las lecciones incluidas no se pueden borrar; solo las que importas o creas.','warn');return}
  if(!confirm('¿Borrar la lección «'+L.title+'»?'))return;
  store.set('custom',store.get('custom',[]).filter(x=>x.id!==L.id));this.li=0;this.ci=0;this.enter();
 },
 importPGN(){
  const txt=$('#lsTxt').value,msg=$('#lsImpMsg');
  const r=parseStudyPGN(txt);if(!r.chapters.length&&!r.games.length){msg.textContent='No encontré partidas válidas en ese PGN.';return}
  const name=($('#lsName').value||'Mi repertorio').trim(),side=$('#lsSide').value;const cs=store.get('custom',[]);let made=[];
  const put=L=>{const k=cs.findIndex(x=>x.id===L.id);if(k>=0)cs[k]=L;else cs.push(L);made.push(L)};
  if(r.chapters.length)put({id:'p'+hash(name),title:name,side,custom:true,intro:'Repertorio importado desde PGN: '+r.chapters.length+' capítulos.',chapters:r.chapters});
  if(r.games.length&&$('#lsGames').checked)put({id:'p'+hash(name+'|modelo'),title:name+' — partidas modelo',side,custom:true,kind:'games',intro:'Partidas completas de maestros. Recomendado: modo Estudio.',chapters:r.games});
  store.set('custom',cs);
  this.li=this.all().findIndex(x=>x.id===made[0].id);this.ci=0;this.enter();
  Chat.say(`Importé <b>${made.length}</b> lección(es): ${made.map(l=>esc(l.title)+' ('+l.chapters.length+' cap.)').join(', ')}.${r.bad?' Aviso: '+r.bad+' jugada(s) ilegales truncaron algún capítulo.':''}`,'ok');
 },
 mv(){return this.cm||this.ch().moves},
 varChips(){const lv=this.lastV;if(!lv)return[];return lv.v.map((v,i)=>({label:'↪ Seguir variante '+(i+1)+': '+v[0].san,fn:()=>this.branch(i)}))},
 branch(vi){const lv=this.lastV;if(!lv)return;const v=lv.v[vi];A.game.undo();A.epoch++;A.viewIdx=null;A.sync();A.updateControls();
  this.cm=this.mv().slice(0,lv.idx).concat(v);this.i=lv.idx;this.lastV=null;
  Chat.say('Sigues la <b>variante '+(vi+1)+'</b>. Para volver a la línea principal pulsa «Reiniciar».','ok');this.advance()},
 varNote(step,prev){if(!step.v||!step.v.length)return;
  Chat.say('↪ <b>Alternativas</b> en esta posición<br>'+step.v.map((v,i)=>`<b>Variante ${i+1}:</b> ${esc(Rep.lineText(prev,v.map(x=>x.san)))}${v[0].c?' — '+v[0].c:''}`).join('<br>'),'warn')},
 deco(step){board.arrows=(step.a||[]).map(a=>a.slice(0,3));board.marks=step.k||[];board.draw()},
 seg(){$('#mPrac').classList.toggle('on',!this.study);$('#mStud').classList.toggle('on',this.study)},
 fillCh(){const ps=store.get('prog',{});$('#chSel').innerHTML=this.lesson().chapters.map((c,i)=>`<option value="${i}">${((ps[this.lesson().id]||[]).includes(c.id)?'✓ ':'')+esc(c.title)}</option>`).join('');$('#chSel').value=this.ci},
 leave(){},
 start(){
  const L=this.lesson(),ch=this.ch();
  A.epoch++;Engine.stop();A.game=ch.fen?new Chess(ch.fen):new Chess();A.startFen=A.game.fen();A.viewIdx=null;
  A.userColor=ch.side||L.side||'w';board.flipped=A.userColor==='b';board.arrows=[];board.marks=[];
  this.i=0;this.fails=0;this.hint=0;this.hinted=false;this.lock=false;this.finished=false;this.cm=null;this.lastV=null;
  setEval(null);$('#engineLines').innerHTML='';A.sync();A.updateControls();Chat.clear();
  Chat.say(`<b>${esc(ch.title)}</b><br>${ch.intro||L.intro||''}`);
  if(this.study)Chat.say('Modo <b>estudio</b>: pulsa «Siguiente jugada» y te explico cada movimiento. Puedes retroceder con las flechas para analizar el tablero con calma.');
  else Chat.say(`Modo <b>práctica</b>: tú llevas las ${A.userColor==='w'?'blancas':'negras'}. Juega la jugada del repertorio; si dudas, pulsa «Pista».`);
  this.advance();
 },
 advance(){
  const ch=this.ch();board.arrows=[];board.marks=[];board.draw();
  if(this.i>=this.mv().length)return this.finish();
  this.cur=this.mv()[this.i];const mine=A.game.turn()===A.userColor;
  if(this.study){A.status('');Chat.chips([{label:'Siguiente jugada ▶',pri:true,fn:()=>this.playStep()},...this.varChips()]);return}
  Chat.chips([{label:'Pista',fn:()=>this.giveHint()}]);
  if(!mine){A.status('Responde el rival…');this.lock=true;setTimeout(()=>{this.lock=false;if(A.live())this.playStep()},650)}
  else A.status('Tu turno: juega la jugada de la línea');
 },
 label(prevFen,san){const p=prevFen.split(' ');return (p[1]==='w'?p[5]+'. ':p[5]+'... ')+san},
 playStep(){
  const step=this.cur;if(!step)return;A.viewIdx=null;
  const prev=A.game.fen();const m=A.game.move(step.san);
  if(!m){Chat.say('No pude aplicar «'+esc(step.san)+'». Revisa la lección.','bad');return}
  A.epoch++;A.sync();A.updateControls();
  board.arrows=(step.a||[]).map(a=>a.slice(0,3));board.draw();
  const mine=m.color===A.userColor;
  Chat.say(`<b>${esc(this.label(prev,m.san))}</b>${step.c?' — '+step.c:''}`,mine?'ok':'');
  this.varNote(step,prev);this.lastV=step.v&&step.v.length?{v:step.v,idx:this.i}:null;
  this.i++;this.advance();this.deco(step);
 },
 onMove(m){
  const step=this.cur;if(!step)return;const prev=A.fens[A.fens.length-2];
  const key=SRS.key(this.lesson().id,this.ch().id,this.i);
  const alt=(step.v||[]).find(v=>v[0]&&clean(v[0].san)===clean(m.san));
  if(clean(m.san)===clean(step.san)){
   if(this.fails===0)SRS.grade(key,this.hinted?'hard':'good',true);
   this.fails=0;this.hint=0;this.hinted=false;
   Chat.say(`✓ <b>${esc(this.label(prev,m.san))}</b>${step.c?' — '+step.c:' Correcto.'}`,'ok');
   this.varNote(step,prev);this.i++;this.advance();this.deco(step);
  }else if(alt){
   this.cm=this.mv().slice(0,this.i).concat(alt);this.fails=0;this.hint=0;this.hinted=false;
   Chat.say(`✓ <b>${esc(this.label(prev,m.san))}</b> — es una <b>variante válida</b> de tu repertorio (la línea principal era <b>${esc(step.san)}</b>). Seguimos por aquí.${alt[0].c?'<br>'+alt[0].c:''}`,'ok');
   this.i++;this.advance();this.deco(alt[0]);
  }else{
   this.fails++;this.lock=true;if(this.fails===1)SRS.grade(key,'again',true);
   const w=step.wrong&&step.wrong[m.san];
   let msg=w?w:`<b>${esc(m.san)}</b> es legal, pero no es la jugada de esta línea del repertorio.`;
   if(this.fails===1&&step.h&&!w)msg+=`<br>Idea: ${step.h}`;
   if(this.fails>=2){msg+=`<br>La jugada es <b>${esc(step.san)}</b>.`}
   Chat.say(msg,'bad');
   setTimeout(()=>{A.game.undo();A.sync();A.updateControls();this.lock=false;
    if(this.fails>=2){this.showMove(step.san)}},800);
  }
 },
 showMove(san){const c=new Chess(A.game.fen());const m=c.move(san);if(m){board.arrows=[[m.from,m.to]];board.draw()}},
 giveHint(){
  if(this.study||!this.cur||this.finished)return;
  const c=new Chess(A.game.fen());const m=c.move(this.cur.san);if(!m)return;
  if(A.game.turn()!==A.userColor)return;
  this.hint++;this.hinted=true;
  if(this.hint===1){board.marks=[m.from];board.draw();Chat.say(this.cur.h?`Pista: ${this.cur.h} La pieza está marcada.`:'Pista: mueve la pieza marcada.','warn')}
  else{board.marks=[];board.arrows=[[m.from,m.to]];board.draw();Chat.say(`Es <b>${esc(m.san)}</b>.`,'warn')}
 },
 finish(){
  this.finished=true;Log.add('les',1);Snd.play('win',.3);A.status('Capítulo completado');const L=this.lesson(),ch=this.ch();
  const ps=store.get('prog',{});ps[L.id]=ps[L.id]||[];if(!ps[L.id].includes(ch.id))ps[L.id].push(ch.id);store.set('prog',ps);
  Chat.say(`<b>¡Capítulo completado!</b><br>${ch.outro||''}`,'ok');
  const chips=[{label:'Practicar vs Stockfish desde aquí',pri:true,fn:()=>Play.fromPosition(A.game.fen(),A.userColor)},
   {label:'Añadir al repaso espaciado',fn:()=>{const n=SRS.seed(L,ch);Chat.say(n?`Añadí <b>${n}</b> jugadas de este capítulo a tu repaso espaciado. Las verás en la pestaña «Repaso».`:'Este capítulo ya está en tu repaso espaciado.','ok');updateBadge()}},
   {label:'Analizar posición',fn:analyze},{label:'Repetir capítulo',fn:()=>this.start()}];
  if(this.ci<L.chapters.length-1)chips.push({label:'Siguiente capítulo ▶',fn:()=>{this.ci++;$('#chSel').value=this.ci;this.start()}});
  Chat.chips(chips);this.fillCh();
 }
};

/* =============== MODO TÁCTICA =============== */
const Tac={
 free:false,i:0,s:0,tries:0,failed:false,done:false,col:'basic',mq:0,
 canMove(){return !this.done&&!this.lock},
 list(){return (COLS[this.col]||COLS.basic).get()},
 label(p,i){return p.n?`${i+1}. Mate en ${p.n}`:p.best?`${i+1}. Mejorar la posición`:`${i+1}. ${p.theme}`},
 fill(){const L=this.list();$('#tpSel').innerHTML=L.map((p,i)=>`<option value="${i}">${esc(this.label(p,i))}</option>`).join('');if(this.i>=L.length)this.i=0;$('#tpSel').value=this.i},
 enter(){
  this.col=store.get('tcol','basic');if(!COLS[this.col]||(this.col==='theme'&&!this.theme))this.col='basic';
  $('#ctl').innerHTML=`<div class="g2"><label>Colección<select id="tpCol">${Object.entries(COLS).filter(([k])=>k!=='theme'||Tac.theme).map(([k,c])=>`<option value="${k}">${esc(k==='theme'?'Tema: '+Tac.theme:c.n)} (${c.get().length})</option>`).join('')}</select></label>
  <label>Problema<select id="tpSel"></select></label></div>
  <div class="row"><button id="tpHint">Pista</button><button id="tpRestart">Reiniciar</button><button id="tpRand">Al azar</button><button id="tpNext" class="pri">Siguiente problema ▶</button></div>`;
  $('#tpCol').value=this.col;this.i=0;this.fill();
  $('#tpCol').onchange=e=>{this.col=e.target.value;store.set('tcol',this.col);this.i=0;this.fill();this.load()};
  $('#tpSel').onchange=e=>{this.i=+e.target.value;this.load()};
  $('#tpHint').onclick=()=>this.hint();$('#tpRestart').onclick=()=>this.load();
  $('#tpRand').onclick=()=>{const L=this.list();this.i=Math.floor(Math.random()*L.length);$('#tpSel').value=this.i;this.load()};
  $('#tpNext').onclick=()=>{this.i=(this.i+1)%this.list().length;$('#tpSel').value=this.i;this.load()};
  this.load();
 },
 leave(){},
 focusTheme(t){this.theme=t;store.set('tcol','theme');Mode.set('tactics',()=>{this.i=Math.floor(Math.random()*this.list().length);$('#tpSel').value=this.i;this.load()})},
 load(){
  const p=this.list()[this.i];if(!p)return;A.epoch++;Engine.stop();A.game=new Chess(p.fen);A.startFen=A.game.fen();A.viewIdx=null;
  A.userColor=A.game.turn();board.flipped=A.userColor==='b';board.arrows=[];board.marks=[];
  this.s=0;this.tries=0;this.failed=false;this.done=false;this.lock=false;this.mq=p.n||0;
  setEval(null);$('#engineLines').innerHTML='';A.sync();A.updateControls();Chat.clear();
  const who=A.userColor==='w'?'blancas':'negras';
  if(p.n)Chat.say(`<b>Problema ${this.i+1} · Mate en ${p.n}</b><br>Juegan ${who}. Da mate en ${p.n} jugada${p.n>1?'s':''}, pase lo que pase el rival.`);
  else if(p.best)Chat.say(`<b>Problema ${this.i+1} · Mejorar la posición</b><br>Juegan ${who}. Es una posición de plan más que de táctica: encuentra la mejor jugada de <b>plan</b> (pieza, casilla o ruptura).`);
  else Chat.say(`<b>Problema ${this.i+1} · ${esc(p.theme)}</b><br>Juegan ${who}. Encuentra la mejor jugada.`);
  A.status('Tu turno');Chat.chips([{label:'Pista',fn:()=>this.hint()}]);
 },
 stat(ok){Log.add('tac',1,ok);const s=store.get('tstats',{});const t=this.list()[this.i].theme;s[t]=s[t]||{ok:0,fail:0};ok?s[t].ok++:s[t].fail++;store.set('tstats',s)},
 wrong(msg){this.tries++;this.lock=true;if(!this.failed){this.failed=true;this.stat(false)}Chat.say(msg,'bad');setTimeout(()=>{A.game.undo();A.sync();A.updateControls();this.lock=false},700)},
 onMove(m){
  const p=this.list()[this.i];
  if(p.n)return this.onMate(m,p);
  if(p.best)return this.onPos(m,p);
  const exp=p.sol[this.s];const last=this.s>=p.sol.length-1;
  let ok;
  if(exp==='#')ok=A.game.in_checkmate();
  else{ok=(Array.isArray(exp)?exp:[exp]).map(clean).includes(clean(m.san));if(!ok&&last&&A.game.in_checkmate())ok=true}
  if(ok){
   this.s++;
   if(this.s>=p.sol.length)return this.solved();
   this.lock=true;
   setTimeout(()=>{ // respuesta forzada del rival
    const r=p.sol[this.s];let mv=null;
    if(r)mv=A.game.move(r);else{const l=A.game.moves();mv=A.game.move(l[0])}
    this.s++;A.sync();A.updateControls();this.lock=false;
    Chat.say('✓ Bien. El rival responde <b>'+esc(mv.san)+'</b>. Sigue.','ok');
    if(this.s>=p.sol.length)this.solved();
   },600);
  }else this.wrong(`<b>${esc(m.san)}</b> no es la mejor jugada. Busca ${p.theme==='Mate en 1'||p.theme.startsWith('Mate')?'jaques y capturas forzadas':'amenazas dobles o ataques a piezas indefensas'}.`);
 },
 onMate(m,p){
  const rem=this.mq-1,first=this.mq===p.n,inF=p.f.map(clean).includes(clean(m.san));
  let ok;
  if(rem===0)ok=A.game.in_checkmate();
  else if(rem===1)ok=MateU.forced(new Chess(A.game.fen()),1);
  else ok=first&&inF;
  if(!ok){this.wrong(`<b>${esc(m.san)}</b> no fuerza el mate en ${this.mq}. Busca jaques, sacrificios y movimientos que dejen al rey sin casillas.`);return}
  this.mq--;
  if(rem===0)return this.solved();
  this.lock=true;
  setTimeout(()=>{
   const c=new Chess(A.game.fen());const ms=c.moves();let r=null;
   if(first&&p.rep&&inF&&clean(m.san)===clean(p.f[0])&&ms.includes(p.rep))r=p.rep;
   if(!r)r=ms[Math.floor(Math.random()*ms.length)];
   const mv=A.game.move(r);A.sync();A.updateControls();this.lock=false;
   Chat.say(`✓ Bien. El rival responde <b>${esc(mv.san)}</b>. Faltan ${this.mq} jugada${this.mq>1?'s':''} para el mate.`,'ok');
  },600);
 },
 onPos(m,p){
  if(clean(m.san)===clean(p.best))return this.solved();
  const s=(p.sec||[]).find(x=>clean(x[0])===clean(m.san));
  let msg=`<b>${esc(m.san)}</b> ${s?`es una jugada razonable (≈${fmtEv(s[1])} para ti), pero no es la mejor.`:'no es la mejor jugada.'}`;
  const next=this.tries+1;
  msg+=next>=3?` La mejor era <b>${esc(p.best)}</b> (≈${fmtEv(p.ev)}). Juégala para continuar.`:' Piensa en el plan: ¿qué pieza está peor situada, qué casilla débil o ruptura puedes aprovechar?';
  this.wrong(msg);
  if(next>=3)setTimeout(()=>{const c=new Chess(A.game.fen());const x=c.move(p.best);if(x){board.arrows=[[x.from,x.to]];board.draw()}},900);
 },
 solved(){
  const p=this.list()[this.i];this.done=true;if(!this.failed)this.stat(true);
  A.status('¡Resuelto!');Snd.play('ok',.12);let h;
  if(p.n)h=`<b>¡Mate!</b> ${esc(p.pat)}.<br>${p.expl}<br><span class="small">Línea: ${esc(p.line)}</span>`;
  else if(p.best){const alt=p.sec&&p.sec[0];h=`<b>¡Correcto: ${esc(p.best)}!</b> ${p.idea}<br><span class="small">Stockfish: con ${esc(p.best)} tu posición vale ≈${fmtEv(p.ev)}${alt?`; la mejor alternativa (${esc(alt[0])}) deja ≈${fmtEv(alt[1])}`:''}.</span>`}
  else h=`<b>¡Correcto!</b> ${p.expl}`;
  Chat.say(h+(this.failed?'':'<br>Resuelto al primer intento.'),'ok');
  Chat.chips([{label:'Siguiente problema ▶',pri:true,fn:()=>$('#tpNext').click()},{label:'Analizar con Stockfish',fn:analyze}]);
 },
 hint(){
  if(this.done)return;const p=this.list()[this.i];let exp;
  if(p.n){
   const c=new Chess(A.game.fen());
   if(this.mq===1){exp=c.moves().find(x=>{c.move(x);const k=c.in_checkmate();c.undo();return k})}
   else if(this.mq===2){exp=c.moves().find(x=>{c.move(x);const k=MateU.forced(c,1);c.undo();return k})}
   else exp=p.f[0];
  }else if(p.best)exp=p.best;
  else{exp=p.sol[this.s];if(Array.isArray(exp))exp=exp[0]}
  if(!exp||exp==='#'){Chat.say('Busca un jaque que deje al rey sin casillas.','warn');return}
  const c=new Chess(A.game.fen());const m=c.move(exp);if(!m)return;
  if(!this._h||this._h.i!==this.i||this._h.s!==this.s+this.mq){this._h={i:this.i,s:this.s+this.mq,n:0}}
  this._h.n++;
  if(this._h.n===1){board.marks=[m.from];board.draw();Chat.say('Pista: mira la pieza marcada.','warn')}
  else{board.marks=[];board.arrows=[[m.from,m.to]];board.draw();Chat.say(`Es <b>${esc(m.san)}</b>.`,'warn')}
 }
};

 async onMove(m){

     const num=fenBefore.split(' ');const lab=(num[1]==='w'?num[5]+'. ':num[5]+'... ')+m.san;
     if(uci===this.pre.best||loss<=15)Chat.say(`<b>${esc(lab)}</b>: ${uci===this.pre.best?'¡la mejor jugada!':'muy buena jugada.'} Evaluación ${ev.text}.`,'ok');

const DAY=864e5;
const SRS={
 all(){return store.get('srs',{})},
 key:(l,c,i)=>l+'|'+c+'|'+i,
 /* grade: 'again' (fallo), 'hard' (con pista), 'good'. early=true: practicar antes de la fecha no adelanta el calendario */
 grade(key,q,early){
  const d=this.all(),now=Date.now();let c=d[key];const isNew=!c;
  if(!c)c={ease:2.4,ivl:0,reps:0,lapses:0,due:0};
  if(early&&!isNew&&c.due>now&&q!=='again')return c;
  if(q==='again'){c.lapses++;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.due=now+10*60e3}
  else{
   if(c.reps===0)c.ivl=1;else if(c.reps===1)c.ivl=q==='hard'?2:3;else c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*(q==='hard'?1.2:c.ease)));
   c.reps++;if(q==='hard')c.ease=Math.max(1.3,c.ease-.1);
   c.due=now+c.ivl*DAY;
  }
  c.last=now;d[key]=c;store.set('srs',d);updateBadge();if(!early)Log.add('srs',1,q!=='again');return c;
 },
 dueList(now=Date.now()){const d=this.all();return Object.keys(d).filter(k=>d[k].due<=now).sort((a,b)=>d[a].due-d[b].due).map(k=>({key:k,card:d[k]}))},
 nextDue(){const d=this.all();const t=Object.values(d).map(c=>c.due).filter(x=>x>Date.now());return t.length?Math.min(...t):null},
 seed(L,ch){
  const d=this.all();let n=0;const g=new Chess(ch.fen||undefined);
  ch.moves.forEach((st,i)=>{if(g.turn()===(ch.side||L.side||'w')){const k=this.key(L.id,ch.id,i);if(!d[k]){d[k]={ease:2.4,ivl:0,reps:0,lapses:0,due:Date.now()};n++}}g.move(st.san)});
  store.set('srs',d);return n;
 },
 stats(){const d=this.all(),v=Object.values(d),now=Date.now();
  return {total:v.length,due:v.filter(c=>c.due<=now).length,mature:v.filter(c=>c.ivl>=21).length,week:v.filter(c=>c.due>now&&c.due<=now+7*DAY).length,lapses:v.reduce((a,c)=>a+c.lapses,0)}},
 text(c){return c.ivl<=0?'La verás de nuevo en unos minutos.':`Volverás a verla en ${c.ivl} día${c.ivl===1?'':'s'}.`}
};
function updateBadge(){const n=SRS.dueList().length;const b=document.querySelector('#tabs [data-m=review]');if(b)b.textContent='Repaso'+(n?` (${n})`:'')}
function findCard(key){
 const [lid,cid,i]=key.split('|');const L=Lesson.all().find(l=>l.id===lid);if(!L)return null;
 const ch=L.chapters.find(c=>c.id===cid);if(!ch)return null;const step=ch.moves[+i];if(!step)return null;
 const g=new Chess(ch.fen||undefined);for(let k=0;k<+i;k++){if(!g.move(ch.moves[k].san))return null}
 return {L,ch,i:+i,step,game:g};
}
const Rev={
 free:false,queue:[],cur:null,lock:false,fails:0,hinted:false,hint:0,graded:false,done:0,total:0,
 canMove(){return !!this.cur&&!this.lock},
 enter(){
  $('#ctl').innerHTML='<div class="small" id="revInfo"></div><div class="row"><button id="rvHint">Pista</button><button id="rvShow">Mostrar respuesta</button><button id="rvSkip">Saltar</button></div>';
  $('#rvHint').onclick=()=>this.giveHint();$('#rvShow').onclick=()=>this.show();$('#rvSkip').onclick=()=>this.next();
  Chat.clear();this.queue=SRS.dueList().map(x=>({key:x.key,retry:false}));this.total=this.queue.length;this.done=0;this.cur=null;
  if(!this.total)return this.finish(true);
  Chat.say(`<b>Repaso espaciado</b>: tienes <b>${this.total}</b> jugada${this.total===1?'':'s'} para repasar. En cada posición, juega la jugada del repertorio. Si fallas, volverá a aparecer pronto; si la dominas, tardará cada vez más en volver.`);
  this.next();
 },
 leave(){},

  board.arrows=[];board.marks=[];let item,c=null;

  if(!c){this.cur=null;return this.finish(false)}

  A.epoch++;A.game=c.game;A.startFen=new Chess(c.ch.fen||undefined).fen();A.viewIdx=null;A.userColor=c.ch.side||c.L.side||'w';board.flipped=A.userColor==='b';
  setEval(null);$('#engineLines').innerHTML='';A.sync();A.updateControls();this.info();
  const last=A.hist[A.hist.length-1];const prev=A.fens[A.fens.length-2];
  const n=A.fens[A.fens.length-1].split(' ');const mv=+n[5];

 },
 onMove(m){

   let card=null;if(!this.graded&&!c.retry)card=SRS.grade(c.key,this.hinted?'hard':'good');

   this.done++;this.lock=true;board.arrows=(c.step.a||[]).map(a=>a.slice(0,3));board.draw();

  }else{
   this.fails++;this.lock=true;
   if(!this.graded&&!c.retry){SRS.grade(c.key,'again');this.graded=true;this.queue.push({key:c.key,retry:true})}

   let msg=w?w:`<b>${esc(m.san)}</b> no es la jugada de esta línea.`;
   if(this.fails===1&&c.step.h&&!w)msg+=`<br>Idea: ${c.step.h}`;
   if(this.fails>=2)msg+=`<br>La jugada es <b>${esc(c.step.san)}</b>.`;
   Chat.say(msg,'bad');
   setTimeout(()=>{A.game.undo();A.sync();A.updateControls();this.lock=false;if(this.fails>=2)this.arrow()},800);
  }
 },
 arrow(){const c=this.cur;const t=new Chess(A.game.fen());const m=t.move(c.step.san);if(m){board.arrows=[[m.from,m.to]];board.draw()}},
 giveHint(){
  const c=this.cur;if(!c||this.lock)return;const t=new Chess(A.game.fen());const m=t.move(c.step.san);if(!m)return;
  this.hint++;this.hinted=true;
  if(this.hint===1){board.marks=[m.from];board.draw();Chat.say(c.step.h?`Pista: ${c.step.h} La pieza está marcada.`:'Pista: mueve la pieza marcada.','warn')}
  else{board.marks=[];board.arrows=[[m.from,m.to]];board.draw();Chat.say(`Es <b>${esc(m.san)}</b>.`,'warn')}
 },
 show(){
  const c=this.cur;if(!c||this.lock)return;
  if(!this.graded&&!c.retry){SRS.grade(c.key,'again');this.graded=true;this.queue.push({key:c.key,retry:true})}
  this.arrow();Chat.say(`La jugada era <b>${esc(c.step.san)}</b>${c.step.c?' — '+c.step.c:''}<br><span class="small">Cuenta como fallo; la repasarás de nuevo.</span>`,'warn');
  this.lock=true;Chat.chips([{label:'Siguiente ▶',pri:true,fn:()=>this.next()}]);
 },
 finish(empty){
  A.game=new Chess();A.startFen=A.game.fen();A.viewIdx=null;board.flipped=false;board.arrows=[];board.marks=[];setEval(null);A.sync();A.updateControls();A.status('');this.info();
  const nx=SRS.nextDue(),st=SRS.stats();
  if(empty&&!st.total)Chat.say('Aún no tienes jugadas en el repaso espaciado. Practica un capítulo en <b>Lecciones › Práctica</b> (o pulsa «Añadir al repaso espaciado» al terminar uno) y aquí te iré preguntando cada posición justo cuando estés por olvidarla.');
  else Chat.say(empty?'<b>No tienes repasos pendientes.</b>':`<b>¡Repaso completado!</b> Respondiste ${this.done} jugada${this.done===1?'':'s'}.`,'ok');
  if(st.total){let h=`Tarjetas: <b>${st.total}</b> · Dominadas (≥21 días): <b>${st.mature}</b> · Para los próximos 7 días: <b>${st.week}</b>`;if(nx)h+=`<br>Próximo repaso: ${new Date(nx).toLocaleString('es',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`;Chat.say(h)}
  Chat.chips([{label:'Ir a Lecciones',pri:true,fn:()=>Mode.set('lesson')},{label:'Jugar vs Stockfish',fn:()=>Mode.set('play')}]);
 }
};

  chapters:x.pos.map((p,j)=>{

}

 },

 load(p,decor){
  const fen=this.fen(p);A.epoch++;Engine.stop();A.game=new Chess(fen);A.startFen=fen;A.viewIdx=null;A.userColor=p.side;board.flipped=p.side==='b';
  board.arrows=decor?(p.a||[]).map(a=>a.slice(0,3)):[];board.marks=decor?(p.k||[]):[];
  setEval(null);$('#engineLines').innerHTML='';A.sync();A.updateControls();board.draw();
 },
 st(){return STRUCTS[this.si]},
 study(){
  const x=this.st();const p=x.pos[this.pi];this.cur=p;Chat.clear();
  this.load(p,true);
  Chat.say(`<b>${esc(x.name)}</b><br><span class="small">${esc(x.tag)}</span><br><br><b>Cómo reconocerla.</b> ${x.know}<br><br><b>Plan de las blancas.</b> ${x.white}<br><br><b>Plan de las negras.</b> ${x.black}<br><br><b>Errores típicos.</b> ${x.errors}<br><br><b>Dónde aparece.</b> ${esc(x.appears)}`);
  Chat.say(`<b>Posición ${this.pi+1}/${x.pos.length}</b> — ${p.note}<br><span class="small">Mueve las piezas libremente para explorar, o pulsa «Analizar».</span>`,'ok');
  A.status('Posición típica '+(this.pi+1)+'/'+x.pos.length);
  const chips=[{label:'Adivina el plan',pri:true,fn:()=>{this.rand=false;this.ask()}}];
  if(x.pos.length>1)chips.push({label:'Posición '+(this.pi===0?2:1)+' ▶',fn:()=>{this.pi=this.pi===0?1:0;this.study()}});
  chips.push({label:'Jugar desde aquí',fn:()=>this.playHere()},{label:'Analizar posición',fn:analyze});
  Chat.chips(chips);
 },
 pickRandom(){
  const st=this.stats();const items=[];
  STRUCTS.forEach((x,i)=>x.pos.forEach((p,j)=>{const s=st[x.id+'|'+j];const w=!s?3:1+5*(1-s.ok/s.n);items.push({i,j,w})}));
  const tot=items.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,k=0;for(;k<items.length-1;k++){r-=items[k].w;if(r<=0)break}
  this.si=items[k].i;this.pi=items[k].j;const sel=$('#stSel');if(sel)sel.value=this.si;
 },
 ask(){
  const x=this.st(),p=x.pos[this.pi];this.cur=p;Chat.clear();this.load(p,false);
  const opts=p.opts.map((o,i)=>({t:o[0],ok:!!o[1],why:o[2]})).map(o=>[Math.random(),o]).sort((a,b)=>a[0]-b[0]).map(o=>o[1]);this.opts=opts;this.answered=false;
  const L='ABCD';
  Chat.say(`<b>${esc(x.name)}</b> · pregunta ${this.rand?'aleatoria':(this.pi+1)+'/'+x.pos.length}<br>${esc(p.q)}<br><br>${opts.map((o,i)=>`<b>${L[i]})</b> ${esc(o.t)}`).join('<br>')}`);
  A.status('Adivina el plan: elige A–D');
  Chat.chips([...opts.map((o,i)=>({label:L[i],pri:true,fn:()=>this.answer(i)})),{label:'Analizar posición',fn:analyze}]);
 },
 answer(i){
  if(this.answered)return;this.answered=true;const x=this.st(),p=this.cur,o=this.opts[i],good=this.opts.find(q=>q.ok);const L='ABCD';
  Log.add('str',1,o.ok);const st=this.stats(),key=x.id+'|'+this.pi;const s=st[key]||{ok:0,n:0};s.n++;if(o.ok)s.ok++;st[key]=s;store.set('struct',st);
  this.load(p,true);
  Chat.me(`${L[i]}) ${esc(o.t)}`);
  if(o.ok)Snd.play('ok');
  if(o.ok)Chat.say(`✓ <b>Correcto: ${esc(o.t)}</b><br>${esc(o.why)}`,'ok');
  else Chat.say(`✗ <b>${L[i]} no es el plan.</b> ${esc(o.why)}<br><br>La respuesta correcta era <b>${L[this.opts.indexOf(good)]}) ${esc(good.t)}</b><br>${esc(good.why)}`,'bad');
  Chat.say(p.note);A.status(o.ok?'¡Bien!':'Revisa la explicación');
  const chips=[{label:'Siguiente pregunta ▶',pri:true,fn:()=>this.next()},{label:'Jugar desde aquí',fn:()=>this.playHere()},{label:'Analizar posición',fn:analyze},{label:'Ver explicación',fn:()=>{this.rand=false;this.study()}}];
  Chat.chips(chips);
 },
 next(){
  if(this.rand){this.pickRandom();return this.ask()}
  const x=this.st();if(this.pi<x.pos.length-1)this.pi++;else{this.si=(this.si+1)%STRUCTS.length;this.pi=0;const sel=$('#stSel');if(sel)sel.value=this.si}
  this.ask();
 },
 playHere(){const p=this.cur||this.st().pos[0];Play.fromPosition(this.fen(p),p.side)},
 panel(){
  const st=this.stats();let tot=0,h='<h3>Estructuras de peones: Adivina el plan</h3>';
  const rows=STRUCTS.map(x=>{let ok=0,n=0;x.pos.forEach((p,j)=>{const s=st[x.id+'|'+j];if(s){ok+=s.ok;n+=s.n}});tot+=n;return {x,ok,n}});
  if(!tot)return h+'<div class="small">Aún sin respuestas: prueba la pestaña Peones.</div>';
  h+='<table>';for(const r of rows){const pct=r.n?Math.round(r.ok/r.n*100):0;h+=`<tr><td>${esc(r.x.name)}</td><td>${r.n?pct+'%':'—'}</td><td>${r.n} resp.</td><td><div class="bar"><i style="width:${pct}%"></i></div></td></tr>`}
  return h+'</table>';
 }
};

/* =============== REPERTORIO: ÁRBOL, DESVIACIONES Y EXAMEN =============== */
const Rep={
 key(fen){return fen.split(' ').slice(0,4).join(' ')},
 isGames(l){return l.kind==='games'||l.kind==='struct'||/ — partidas modelo$/.test(l.title||'')},
 lessons(color){return Lesson.all().filter(l=>(l.side||'w')===color&&!this.isGames(l))},
 tree(color){
  const T=new Map();
  const add=(g,san,l,c)=>{const k=this.key(g.fen());let n=T.get(k);const m=new Chess(g.fen()).move(san,{sloppy:true});if(!m)return null;if(!n){n={};T.set(k,n)}if(!n[clean(m.san)])n[clean(m.san)]={san:m.san,l,c};return m};
  for(const l of this.lessons(color))for(const ch of l.chapters){
   let g;try{g=new Chess(ch.fen||undefined)}catch(e){continue}
   for(const st of ch.moves){
    for(const v of (st.v||[])){const h=new Chess(g.fen());for(const x of v){if(!add(h,x.san,l.title,ch.title))break;h.move(x.san,{sloppy:true})}}
    if(!add(g,st.san,l.title,ch.title))break;g.move(st.san,{sloppy:true});
   }
  }
  return T;
 },
 walk(T,color,startFen,sans){
  const g=new Chess(startFen);
  for(let i=0;i<sans.length;i++){
   const n=T.get(this.key(g.fen()));if(!n)return {st:'end',ply:i};
   const fb=g.fen();const mv=g.move(sans[i],{sloppy:true});if(!mv)break;
   if(!n[clean(mv.san)]){const ex=Object.values(n);return {st:'dev',ply:i,who:mv.color===color?'me':'opp',played:mv.san,expected:ex.map(x=>x.san),src:ex[0],fen:fb,line:sans.slice(0,i)}}
  }
  return {st:'in',ply:sans.length};
 },
 lineText(fen,sans,max=10){
  const g=new Chess(fen);const out=[];
  sans.slice(0,max).forEach((s,i)=>{const p=g.fen().split(' ');const m=g.move(s,{sloppy:true});if(!m)return;out.push(p[1]==='w'?p[5]+'. '+m.san:(i===0?p[5]+'... ':'')+m.san)});
  return out.join(' ')+(sans.length>max?' …':'');
 },
 gameSide(g){
  const names=(store.get('myname','')||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);
  const w=(g.white||'').toLowerCase(),b=(g.black||'').toLowerCase();
  return names.some(n=>b.includes(n))&&!names.some(n=>w.includes(n))?'b':'w';
 },
 describe(r,color){
  if(r.st==='dev'){
   if(r.who==='me')return `📖 <b>Te saliste de tu repertorio</b> en la jugada ${Math.floor(r.ply/2)+1}: jugaste <b>${esc(r.played)}</b>; tu repertorio decía <b>${esc(r.expected.join(' / '))}</b>${r.src?' (<i>'+esc(r.src.c)+'</i>)':''}.`;
   return `📖 <b>El rival se salió de tu repertorio</b> en la jugada ${Math.floor(r.ply/2)+1} con <b>${esc(r.played)}</b> (esperabas ${esc(r.expected.join(' / '))}). Es un hueco: puedes guardarlo en Progreso › Repertorio.`;
  }
  if(r.st==='end')return `📖 Tu repertorio cubría esta partida hasta la jugada ${Math.floor(r.ply/2)+1}; desde ahí ya no tienes línea preparada.`;
  return `📖 Toda la partida siguió tu repertorio.`;
 },
 record(it){const d=store.get('dev',[]);d.push(it);store.set('dev',d.slice(-200))},
 trackLive(){
  if(Play.repDone)return;const color=A.userColor,T=this.tree(color);
  if(!T.size||!T.has(this.key(A.startFen))){Play.repDone=true;return}
  const sans=A.hist.map(m=>m.san);if(!sans.length)return;
  const r=this.walk(T,color,A.startFen,sans);if(r.st==='in')return;
  Play.repDone=true;
  if(r.st==='end'){if(r.ply>=4)Chat.say(this.describe(r,color),'warn');return}
  Chat.say(this.describe(r,color),r.who==='me'?'warn':'');
  this.record({src:'play',color,ply:r.ply,who:r.who,played:r.played,expected:r.expected,fen:r.fen,line:r.line,t:Date.now(),src2:r.src&&r.src.c});
 },
 noteGame(g,color){
  const T=this.tree(color);if(!T.size)return;const c=new Chess();if(!c.load_pgn(g.pgn))return;if(c.header().FEN)return;
  Chat.say(this.describe(this.walk(T,color,new Chess().fen(),c.history()),color),'');
 },
 addHole(it){
  const cs=store.get('custom',[]);const id='holes-'+it.color;let L=cs.find(x=>x.id===id);
  if(!L){L={id,title:'Huecos del repertorio ('+(it.color==='w'?'blancas':'negras')+')',side:it.color,custom:true,kind:'holes',intro:'Líneas del rival que todavía no cubres. Estúdialas y añade tu respuesta.',chapters:[]};cs.push(L)}
  const sans=it.line.concat([it.played]);const cid='h'+hash(sans.join(' '));if(L.chapters.some(c=>c.id===cid))return false;
  const g=new Chess();const moves=sans.map(x=>{const m=g.move(x,{sloppy:true});return {san:m?m.san:x}});
  moves[moves.length-1].c='El rival se salió aquí de tu repertorio. Estudia tu mejor respuesta y añádela a tu lección.';
  const last=this.lineText(new Chess().fen(),sans,999).split(' ').slice(-2).join(' ');
  L.chapters.push({id:cid,title:'Hueco: …'+last,intro:'Línea de un rival que no estaba en tu repertorio.',moves,outro:'Busca la mejor respuesta (con Stockfish en «Analizar posición») y crea una lección con ella.'});
  store.set('custom',cs);return true;
 },
 panel(){
  const games=store.get('games_pgn',[]),an=store.get('games_an',{});const items=[];let tot=0,inb=0,skipped=0;const evs=[],errs=[];
  for(const g of games){
   const color=this.gameSide(g),T=this.tree(color);if(!T.size){skipped++;continue}
   const c=new Chess();if(!c.load_pgn(g.pgn)||c.header().FEN)continue;const sans=c.history();
   const r=this.walk(T,color,new Chess().fen(),sans);tot++;

const Log={

   const now=Date.now(),last=+store.get('lastAct',0);d.min+=last&&now-last<180000?(now-last)/60000:.3;store.set('lastAct',now);
   const keys=Object.keys(L).sort();if(keys.length>150)keys.slice(0,keys.length-150).forEach(x=>delete L[x]);

 },

  const L=this.all();let cur=0,d=new Date();if(!this.active(L[this.key(d)]))d.setDate(d.getDate()-1);
  while(this.active(L[this.key(d)])){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;for(const k of Object.keys(L).sort()){if(!this.active(L[k]))continue;const t=new Date(k+'T00:00:00');run=prev&&Math.round((t-prev)/DAY)===1?run+1:1;prev=t;best=Math.max(best,run)}

 }
};

function downloadText(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function parsePGN(text){
 const out=[];let bad=0;text=String(text).replace(/\r/g,'').replace(/^﻿/,'');
 const chunks=text.split(/\n(?=\[Event\s)/).map(x=>x.trim()).filter(Boolean);
 for(const ch of chunks){
  const hdr={};let rest=ch.replace(/^\[(\w+)\s+"([^"]*)"\]\s*$/gm,(m,k,v)=>{hdr[k]=v;return ''});
  let mt=rest.replace(/\{[^}]*\}/g,' ').replace(/;[^\n]*/g,' ');let prev;do{prev=mt;mt=mt.replace(/\([^()]*\)/g,' ')}while(mt!==prev);
  mt=mt.replace(/\$\d+/g,' ').replace(/\s+/g,' ').trim();
  if(!mt&&!Object.keys(hdr).length)continue;
  const c=new Chess();const ht=Object.entries(hdr).map(([k,v])=>`[${k} "${v}"]`).join('\n');
  if(!c.load_pgn(ht+'\n\n'+mt,{sloppy:true})||!c.history().length){bad++;continue}
  const h=c.header();
  out.push({pgn:c.pgn(),white:h.White||'?',black:h.Black||'?',result:h.Result||'*',date:h.Date||'',event:h.Event||'',n:c.history().length});
 }
 return {games:out,bad};
}

const CAL_COL={G:'rgba(70,170,90,.85)',R:'rgba(217,89,76,.85)',B:'rgba(70,130,230,.85)',Y:'rgba(230,190,50,.9)'};
function fmtStudyComment(raw){
 const a=[],k=[];
 raw=raw.replace(/\[%(cal|csl)\s+([^\]]*)\]/g,(m,t,v)=>{v.split(/[,\s]+/).forEach(x=>{const q=/^([GRBY])([a-h][1-8])([a-h][1-8])?$/.exec(x.trim());if(!q)return;if(t==='cal'&&q[3]&&q[3]!==q[2])a.push([q[2],q[3],CAL_COL[q[1]]]);else k.push(q[2])});return ' '});
 raw=raw.replace(/\[%\w+[^\]]*\]/g,' ');
 let h=esc(raw.replace(/\s+/g,' ').trim());
 h=h.replace(/POSICIÓN CLAVE\.?/g,'⭐ <b>POSICIÓN CLAVE</b>').replace(/(Estructura|PLAN BLANCAS|PLAN NEGRAS|ERRORES|CANDIDATAS):/g,'<br><b>$1:</b>');
 return {c:h,a,k};
}
function parseMT(rest,fen,allowVars){
 let c;try{c=fen?new Chess(fen):new Chess()}catch(e){c=new Chess()}
 const startFen=c.fen(),moves=[];let intro='',i=0,bad=0;
 const skipBal=()=>{let d=0,j=i;for(;j<rest.length;j++){const ch=rest[j];if(ch==='{'){const e=rest.indexOf('}',j);j=e<0?rest.length:e;continue}if(ch==='(')d++;else if(ch===')'){d--;if(d===0)break}}const inner=rest.slice(i+1,j);i=j+1;return inner};
 while(i<rest.length){
  const ch=rest[i];
  if(ch==='{'){let j=rest.indexOf('}',i);if(j<0)j=rest.length;const t=rest.slice(i+1,j);i=j+1;if(moves.length)moves[moves.length-1].raw+=' '+t;else intro+=' '+t;continue}
  if(ch==='('){const inner=skipBal();if(allowVars&&moves.length){const sub=parseMT(inner,moves[moves.length-1].fb,false);if(sub.moves.length)moves[moves.length-1].vars.push(sub.moves)}continue}
  if(ch===')'){i++;continue}
  if(ch===';'){const j=rest.indexOf('\n',i);i=j<0?rest.length:j+1;continue}
  if(/\s/.test(ch)){i++;continue}
  const mm=/^[^\s{}();]+/.exec(rest.slice(i,i+40));let tok=mm?mm[0]:rest[i];i+=tok.length;
  tok=tok.replace(/^\d+\.+/,'').replace(/[!?]+$/,'');
  if(!tok||tok[0]==='$'||/^(1-0|0-1|1\/2-1\/2|\*)$/.test(tok))continue;
  const fb=c.fen();const mv=c.move(tok,{sloppy:true});if(!mv){bad++;break}
  moves.push({san:mv.san,raw:'',fb,vars:[]});
 }
 return {moves,intro,bad,startFen};
}
function parseStudyPGN(text){
 const chapters=[],games=[];let bad=0;text=String(text).replace(/\r/g,'').replace(/^﻿/,'');
 const chunks=text.split(/\n(?=\[Event\s)/).map(x=>x.trim()).filter(Boolean);
 chunks.forEach((chunk,gi)=>{
  const hdr={};const rest=chunk.replace(/^\[(\w+)\s+"([^"]*)"\]\s*$/gm,(m,k,v)=>{hdr[k]=v;return ''});
  const r=parseMT(rest,hdr.FEN||null,true);bad+=r.bad;
  if(!r.moves.length)return;
  const toStep=m=>{const f=fmtStudyComment(m.raw);const st={san:m.san};if(f.c)st.c=f.c;if(f.a.length)st.a=f.a;if(f.k.length)st.k=f.k;if(m.vars&&m.vars.length)st.v=m.vars.map(v=>v.map(toStep));return st};
  const steps=r.moves.map(toStep);
  const name=hdr.ChapterName||(hdr.White&&hdr.Black?hdr.White+' – '+hdr.Black+(hdr.Event&&hdr.Event!=='?'?' ('+hdr.Event+(hdr.Date&&!/\?/.test(hdr.Date)?' '+hdr.Date.slice(0,4):'')+')':''):hdr.Event||'Partida '+(gi+1));
  const chap={id:'c'+hash(name+'|'+steps.length),title:name,intro:fmtStudyComment(r.intro).c,moves:steps,outro:''};
  if(hdr.FEN&&r.startFen!==new Chess().fen())chap.fen=r.startFen;
  (hdr.ChapterName?chapters:games).push(chap);
 });
 return {chapters,games,bad};
}

 async analyze(){

  Chat.chips([{label:'Cancelar',fn:()=>{this.run++;Engine.stop();this.open(this.idx)}}]);
  const prof=Engine.kind==='wasm'?{depth:14,movetime:600}:{depth:10,movetime:800};
  const ev=[],best=[],pv=[];

   const c=new Chess(fens[k]);
   if(c.in_checkmate()){ev[k]=c.turn()==='w'?-10000:10000;best[k]=null;pv[k]=''}
   else if(c.game_over()){ev[k]=0;best[k]=null;pv[k]=''}
   else{
    const r=await Engine.search({fen:fens[k],...prof,skill:20});if(ep!==this.run)return;
    const e=whiteEval(fens[k],r.line);ev[k]=e?e.cp:0;best[k]=r.best;pv[k]=r.line?r.line.pv.slice(0,6).join(' '):'';

  }}catch(e){Chat.say('El motor no responde. Prueba recargar la página.','bad');return}
  const an=this.anAll();an[g.id]={ev,best,pv};store.set('games_an',an);Log.add('gam',1);this.report();
 },
 compute(an){
  const h=A.hist,out=[],acc={w:[],b:[]};
  for(let k=1;k<=h.length;k++){
   const m=h[k-1],col=m.color,sg=col==='w'?1:-1;const loss=Math.max(0,wp(an.ev[k-1]*sg)-wp(an.ev[k]*sg));
   const uci=m.from+m.to+(m.promotion||'');
   const cls=uci===an.best[k-1]?'best':loss>=30?'blunder':loss>=20?'mistake':loss>=10?'inacc':'good';
   const a=Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*loss)-3.1669));acc[col].push(a);
   out[k]={cls,loss,col,san:m.san,uci,acc:a};

  for(let k=1;k<cmp.out.length;k++){const o=cmp.out[k];if(o.cls in CLS_SYM){A.marks[k]=o.cls;if(o.col===mine){counts[o.cls]++;crit.push(k)}}}
  A.sync();Chat.clear();

  // gráfica de ventaja
  const n=an.ev.length,W=300,H=84;const y=cp=>H/2-Math.max(-600,Math.min(600,cp))/600*(H/2-4);
  const pts=an.ev.map((cp,k)=>`${(k/(n-1||1)*W).toFixed(1)},${y(cp).toFixed(1)}`);
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;cursor:pointer;background:#1b1a18;border-radius:6px"><polygon points="0,${H/2} ${pts.join(' ')} ${W},${H/2}" fill="rgba(240,240,235,.28)"/><line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#555" stroke-width=".6"/><polyline points="${pts.join(' ')}" fill="none" stroke="#e8e4dc" stroke-width="1.2"/><line id="gmCur" x1="0" y1="0" x2="0" y2="${H}" stroke="#8ab34a" stroke-width="1.2"/></svg>`;
  const m=Chat.say(`<div class="small" style="margin-bottom:4px">Ventaja a lo largo de la partida (arriba: blancas). Haz clic para saltar a esa jugada.</div>${svg}`);
  const sv=m.querySelector('svg');sv.onclick=e=>{const r=sv.getBoundingClientRect();A.goto(Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1)))))};
  // momentos críticos
  crit.sort((a,b)=>cmp.out[b].loss-cmp.out[a].loss);
  const top=crit.slice(0,6).sort((a,b)=>a-b);
  const chips=top.map(k=>({label:`${this.label(k)} ${CLS_SYM[cmp.out[k].cls]}`,fn:()=>this.moment(k)}));
  if(crit.length){Chat.say(`Tus <b>momentos críticos</b> están en los botones de abajo. Pulsa uno para ver qué pasó y cuál era la mejor jugada.`)}
  else Chat.say('No detecté errores importantes en tus jugadas. ¡Buena partida!','ok');
  if(crit.length)chips.push({label:'Guardar mis errores como problemas',pri:true,fn:()=>this.savePuzzles()});
  chips.push({label:'Jugar vs Stockfish desde aquí',fn:()=>Play.fromPosition(A.curFen(),A.userColor)});
  Chat.chips(chips);
  A.goto(0);
 },
 ev(cp,col){const v=(col==='w'?cp:-cp)/100;if(Math.abs(cp)>=9000)return (v>0?'+':'-')+'mate';return (v>=0?'+':'')+v.toFixed(1)},
 moment(k){
  const an=this.anAll()[this.list[this.idx].id],o=this.cmp.out[k];A.goto(k);
  const fb=A.fens[k-1],bu=an.best[k-1];if(!bu)return;const bs=uciToSan(fb,bu);
  board.arrows=[[bu.slice(0,2),bu.slice(2,4)],[o.uci.slice(0,2),o.uci.slice(2,4),'rgba(217,89,76,.85)']];board.draw();
  let why;
  const against=(o.col==='w'?-1:1)*an.ev[k]>=9000;
  if(against)why='Tras esa jugada el rival tenía un <b>mate forzado</b>. Antes de mover, revisa siempre jaques y amenazas del rival.';
  else if(bs.includes('x'))why=`Había una <b>captura</b> mejor (${esc(bs)}). Revisa qué piezas rivales están sin defender antes de decidir.`;
  else if(bs.includes('+'))why=`Había un <b>jaque</b> fuerte (${esc(bs)}) que cambiaba la valoración.`;
  else why=`Stockfish prefería <b>${esc(bs)}</b>: era el plan más preciso en esa posición.`;
  const ph=k<=20?'la <b>apertura</b>: repasa tu repertorio y las ideas de esa línea':k<=60?'el <b>medio juego</b>: practica táctica y cálculo de variantes':'el <b>final</b>: estudia finales básicos y técnica';
  let line='';try{line=pvToSan(fb,an.pv[k-1].split(' '),6)}catch(e){}
  Chat.say(`<b>${esc(this.label(k))}</b> — ${CLS_TXT[o.cls]}.<br>Evaluación: de <b>${this.ev(an.ev[k-1],o.col)}</b> a <b>${this.ev(an.ev[k],o.col)}</b> (desde tu perspectiva).<br>${why}${line?`<br><span class="small">Línea sugerida: ${esc(line)}</span>`:''}<br><span class="small">Tema a repasar: ${ph}.</span>`,o.cls==='inacc'?'warn':'bad');
 },
 onNav(idx){
  const g=this.list[this.idx];if(!g)return;const an=this.anAll()[g.id];
  const cur=document.getElementById('gmCur');
  if(!an||an.ev.length!==A.fens.length){A.status(idx>0?this.label(idx):'');return}
  if(cur){const n=an.ev.length;const x=idx/(n-1||1)*300;cur.setAttribute('x1',x);cur.setAttribute('x2',x)}
  setEval({cp:an.ev[idx],text:(an.ev[idx]>=0?'+':'')+(Math.abs(an.ev[idx])>=9000?'#':(an.ev[idx]/100).toFixed(1))});
  if(idx>0&&this.cmp){const o=this.cmp.out[idx];if(!o)return;
   A.status(`${this.label(idx)} · ${CLS_TXT[o.cls]}${o.cls in CLS_SYM?' '+CLS_SYM[o.cls]:''}`);
   if(o.cls in CLS_SYM&&an.best[idx-1]){const bu=an.best[idx-1];board.arrows=[[bu.slice(0,2),bu.slice(2,4)]];board.draw()}
  }else A.status('');
 },
 savePuzzles(){
  const g=this.list[this.idx],an=this.anAll()[g.id];if(!an||!this.cmp){Chat.say('Primero analiza la partida.','warn');return}
  const pz=store.get('mypuz',[]);let n=0;
  for(let k=1;k<this.cmp.out.length;k++){const o=this.cmp.out[k];if(o.col!==A.userColor||!(o.cls==='mistake'||o.cls==='blunder'))continue;
   const fen=A.fens[k-1],bu=an.best[k-1];if(!bu||pz.some(p=>p.fen===fen))continue;
   const bs=uciToSan(fen,bu);
   pz.push({fen,theme:'Mis errores',sol:[bs],expl:`En tu partida (${g.white} vs ${g.black}) jugaste <b>${esc(o.san)}</b> y era mejor <b>${esc(bs)}</b>. Pueden existir otras jugadas buenas, pero ésta es la que Stockfish prefiere.`});n++}
  store.set('mypuz',pz);
  Chat.say(n?`Guardé <b>${n}</b> problema${n===1?'':'s'} a partir de tus errores. Los encuentras en <b>Táctica › Mis errores</b>.`:'No hay errores nuevos para guardar (o ya estaban guardados).',n?'ok':'');
 }
};
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'g'+(h>>>0).toString(36)+s.length}

 free:false,canMove(){return false},

  Chat.el.innerHTML='<div class="panel">'+h+'</div>';Rep.bind(Chat.el);
